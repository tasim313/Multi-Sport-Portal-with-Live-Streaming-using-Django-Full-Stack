x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: sports_portal.settings
  DEBUG: ${DJANGO_DEBUG:-1}
  DB_NAME: ${DB_NAME:-sports_portal}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-postgres}
  DB_HOST: ${DB_HOST:-192.168.0.50}
  DB_PORT: ${DB_PORT:-5434}
  REDIS_URL: ${REDIS_URL:-redis://192.168.0.50:6379/0}

services:
  web:
    build: .
    volumes:
      - .:/app
    ports:
      - "${WEB_PORT:-8002}:8000"
    environment:
      <<: *app-env
      RUN_STARTUP_TASKS: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celery:
    build: .
    command: celery -A sports_portal worker --loglevel=info
    volumes:
      - .:/app
    environment:
      <<: *app-env
      RUN_STARTUP_TASKS: "0"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celery-beat:
    build: .
    command: celery -A sports_portal beat --loglevel=info
    volumes:
      - .:/app
    environment:
      <<: *app-env
      RUN_STARTUP_TASKS: "0"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db-init:
    image: postgres:16-alpine
    profiles: ["tools"]
    environment:
      PGHOST: ${DB_HOST:-192.168.0.50}
      PGPORT: ${DB_PORT:-5434}
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-sports_portal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c '
        until pg_isready -h "$$PGHOST" -p "$$PGPORT" -U "$$PGUSER"; do sleep 1; done;
        if ! psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '\''$$DB_NAME'\''" | grep -q 1; then
          createdb "$$DB_NAME";
        fi
      '

  postgres:
    image: postgres:16-alpine
    profiles: ["local-deps"]
    environment:
      POSTGRES_DB: ${DB_NAME:-sports_portal}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - sports_portal_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    profiles: ["local-deps"]
    volumes:
      - sports_portal_redis_data:/data

volumes:
  sports_portal_postgres_data:
  sports_portal_redis_data:
