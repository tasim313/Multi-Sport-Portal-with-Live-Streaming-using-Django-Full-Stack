# -----------------------------------------------------------------------------
# Shared environment variables
# -----------------------------------------------------------------------------
x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: sports_portal.settings
  DEBUG: ${DJANGO_DEBUG:-1}

  # Database
  DB_NAME: ${DB_NAME:-sports_portal}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-postgres}
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-5432}

  # Redis
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

  # Django
  SECRET_KEY: ${SECRET_KEY:-django-insecure-change-me-in-production}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}

  # APIs
  FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
  CRICKET_API_KEY: ${CRICKET_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

# -----------------------------------------------------------------------------
# Services
# -----------------------------------------------------------------------------
services:

  # ---------------------------------------------------------------------------
  # PostgreSQL
  #
  # If your server already has a shared PostgreSQL container running,
  # then:
  #
  #   1. Set DB_HOST=<shared-postgres-container-name>
  #   2. Disable this service:
  #
  #      docker compose up -d --scale db=0
  #
  # Otherwise this local PostgreSQL container will run normally.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-sports_portal}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}

    volumes:
      - sports_portal_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - shared-network

  # ---------------------------------------------------------------------------
  # Redis
  #
  # If your server already has a shared Redis container running,
  # then:
  #
  #   1. Set REDIS_URL=redis://<shared-redis-container>:6379/0
  #   2. Disable this service:
  #
  #      docker compose up -d --scale redis=0
  #
  # Otherwise this local Redis container will run normally.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped

    volumes:
      - sports_portal_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - shared-network

  # ---------------------------------------------------------------------------
  # Django / Daphne ASGI
  # ---------------------------------------------------------------------------
  web:
    build: .
    restart: unless-stopped
    command: daphne -b 0.0.0.0 -p 8004 sports_portal.asgi:application

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      <<: *app-env
      RUN_STARTUP_TASKS: "1"

    volumes:
      - .:/app
      - sports_portal_media:/app/media
      - sports_portal_static:/app/staticfiles

    expose:
      - "8004"

    ports:
      - "8004:8004"

    networks:
      - shared-network

  # ---------------------------------------------------------------------------
  # Celery Worker
  # ---------------------------------------------------------------------------
  celery:
    build: .
    command: celery -A sports_portal worker --loglevel=info --concurrency=4
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      <<: *app-env
      RUN_STARTUP_TASKS: "0"

    volumes:
      - .:/app

    networks:
      - shared-network

  # ---------------------------------------------------------------------------
  # Celery Beat
  # ---------------------------------------------------------------------------
  celery-beat:
    build: .
    command: >
      celery -A sports_portal beat
      --loglevel=info

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      <<: *app-env
      RUN_STARTUP_TASKS: "0"

    volumes:
      - .:/app

    networks:
      - shared-network

  # ---------------------------------------------------------------------------
  # Next.js Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8081}

    restart: unless-stopped

    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://web:8002/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://web:8002}
      NODE_ENV: production
      PORT: "3004"

    expose:
      - "3004"

    ports:
      - "3004:3004"

    depends_on:
      - web

    networks:
      - shared-network

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped

    depends_on:
      - web
      - frontend

    ports:
      - "8081:80"
      - "${NGINX_SSL_PORT:-443}:443"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - sports_portal_static:/staticfiles:ro
      - sports_portal_media:/media:ro
      - ./ssl:/etc/nginx/ssl:ro

    networks:
      - shared-network

  # ---------------------------------------------------------------------------
  # DB Init Tool
  # ---------------------------------------------------------------------------
  db-init:
    image: postgres:16-alpine

    profiles:
      - tools

    environment:
      PGHOST: ${DB_HOST:-db}
      PGPORT: ${DB_PORT:-5432}
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-sports_portal}

    depends_on:
      db:
        condition: service_healthy

    command: >
      sh -c '
        until pg_isready -h "$$PGHOST" -p "$$PGPORT" -U "$$PGUSER";
        do
          sleep 1;
        done;

        if ! psql -d postgres -tAc
          "SELECT 1 FROM pg_database WHERE datname = '\''$$DB_NAME'\''"
          | grep -q 1;
        then
          createdb "$$DB_NAME";
        fi
      '

    networks:
      - shared-network

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  sports_portal_postgres_data:
  sports_portal_redis_data:
  sports_portal_media:
  sports_portal_static:

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:

  # ---------------------------------------------------------------------------
  # Shared external Docker network
  #
  # WHY THIS IS USED:
  #
  # Your server may already be running:
  #   - PostgreSQL
  #   - Redis
  #   - Nginx Proxy
  #   - Other microservices
  #
  # Using a shared Docker network allows this project to communicate with
  # those existing containers without exposing ports publicly.
  #
  # Example:
  #   docker network create shared-network
  #
  # If the network already exists:
  #   Docker will use it.
  #
  # If the network does NOT exist:
  #   Docker Compose automatically creates it locally.
  #
  # This gives you BOTH:
  #   ✅ Shared production network support
  #   ✅ Standalone local development support
  # ---------------------------------------------------------------------------
  shared-network:
    name: shared-network
    driver: bridge