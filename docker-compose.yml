x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: sports_portal.settings
  DEBUG: ${DJANGO_DEBUG:-1}
  DB_NAME: ${DB_NAME:-sports_portal}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-postgres}
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-5432}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  SECRET_KEY: ${SECRET_KEY:-django-insecure-change-me-in-production}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
  FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
  CRICKET_API_KEY: ${CRICKET_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sports_portal}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - sports_portal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - sports_portal_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django / Daphne ASGI ────────────────────────────────────────────
  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      RUN_STARTUP_TASKS: "1"
    volumes:
      - .:/app
      - sports_portal_media:/app/media
      - sports_portal_static:/app/staticfiles
    expose:
      - "8000"

  # ── Celery Worker ───────────────────────────────────────────────────
  celery:
    build: .
    command: celery -A sports_portal worker --loglevel=info --concurrency=4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      RUN_STARTUP_TASKS: "0"
    volumes:
      - .:/app

  # ── Celery Beat (scheduler) ─────────────────────────────────────────
  celery-beat:
    build: .
    command: celery -A sports_portal beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      RUN_STARTUP_TASKS: "0"
    volumes:
      - .:/app

  # ── Next.js Frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://web:8000/api
      NEXT_PUBLIC_WS_URL: ws://web:8000
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      - web

  # ── Nginx reverse proxy ─────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    depends_on:
      - web
      - frontend
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - sports_portal_static:/staticfiles:ro
      - sports_portal_media:/media:ro
      - ./ssl:/etc/nginx/ssl:ro

  # ── DB init tool ────────────────────────────────────────────────────
  db-init:
    image: postgres:16-alpine
    profiles: ["tools"]
    environment:
      PGHOST: ${DB_HOST:-db}
      PGPORT: ${DB_PORT:-5432}
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-sports_portal}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c '
        until pg_isready -h "$$PGHOST" -p "$$PGPORT" -U "$$PGUSER"; do sleep 1; done;
        if ! psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '"'"'$$DB_NAME'"'"'" | grep -q 1; then
          createdb "$$DB_NAME";
        fi
      '

volumes:
  sports_portal_postgres_data:
  sports_portal_redis_data:
  sports_portal_media:
  sports_portal_static:
